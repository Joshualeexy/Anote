<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
    <title>Anote - Personal LAN Clipboard & File Explorer</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title-area">
                <h1>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: #c084fc;"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                    Anote
                </h1>
                <div class="status-badge">
                    <div class="status-dot"></div>
                    <span>Online</span>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <div class="nav-tabs">
                <button class="nav-tab active" id="tabBtnClipboard" onclick="switchTab('clipboard')">
                    📋 Clipboard
                </button>
                <button class="nav-tab" id="tabBtnBrowser" onclick="switchTab('browser')">
                    📁 Browse PC
                </button>
            </div>

            <div class="header-right">
                <div class="profile-section">
                    <span class="profile-label">Device:</span>
                    <span class="profile-name" id="profileName" onclick="openRenameModal()">Guest</span>
                </div>
            </div>
        </header>

        <div class="ips-container">
            <div class="ip-list" id="ipList"></div>
            <div style="font-size: 11px; color: var(--text-secondary);">Phone &amp; PC on same Wi-Fi</div>
        </div>

        <!-- ================= TAB 1: CLIPBOARD ================= -->
        <div class="tab-view active" id="tabViewClipboard">
            <div class="main-layout">
                <!-- Sidebar (Device Boxes) -->
                <div class="sidebar">
                    <div class="sidebar-title">Device Boxes</div>
                    <div class="device-list" id="deviceList"></div>
                </div>

                <!-- Content Area -->
                <div class="content-area">
                    <!-- Composer -->
                    <div class="composer">
                        <div class="composer-header">
                            <span>Posting to: <strong id="postingTarget">Global</strong></span>
                            <span>Paste text or images (<kbd>Ctrl+V</kbd>)</span>
                        </div>
                        <textarea id="composerInput" placeholder="Paste your text, code snippet, or paste/attach images here..."></textarea>
                        
                        <!-- Staged Images Preview -->
                        <div class="image-staging" id="imageStaging"></div>

                        <div class="composer-actions">
                            <div class="btn-group">
                                <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
                                <button type="button" class="btn-secondary" onclick="document.getElementById('fileInput').click()">
                                    🖼️ Attach Images
                                </button>
                            </div>
                            <button type="button" id="postBtn" onclick="sendPost()">
                                Post Snippet (Ctrl+S)
                            </button>
                        </div>
                    </div>

                    <!-- Feed Header & Cards -->
                    <div class="feed-container" id="feedContainer"></div>
                </div>
            </div>
        </div>

        <!-- ================= TAB 2: BROWSE PC ================= -->
        <div class="tab-view" id="tabViewBrowser">
            <div class="file-browser-container">
                <!-- Toolbar: Breadcrumbs & Search -->
                <div class="browser-toolbar">
                    <div class="breadcrumbs-bar" id="breadcrumbsBar"></div>

                    <div class="quick-chips">
                        <div class="quick-chip" onclick="loadBrowsePath('')">🏠 Home</div>
                        <div class="quick-chip" onclick="loadBrowsePath('face/output')">🎬 AI Videos</div>
                        <div class="quick-chip" onclick="loadBrowsePath('Downloads')">📥 Downloads</div>
                        <div class="quick-chip" onclick="loadBrowsePath('Videos')">📹 Videos</div>
                        <div class="quick-chip" onclick="loadBrowsePath('comfyui')">🎨 ComfyUI</div>
                    </div>

                    <div class="search-input-wrapper">
                        <input type="text" class="search-input" id="fileSearchInput" placeholder="Filter files in folder..." oninput="filterBrowseTable()">
                    </div>
                </div>

                <!-- File Table -->
                <div class="file-table-container">
                    <table class="file-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th style="width: 110px;">Size</th>
                                <th style="width: 140px;">Modified</th>
                                <th style="width: 140px; text-align: right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="fileTableBody">
                            <tr><td colspan="4" style="text-align: center; padding: 30px; color: var(--text-secondary);">Loading files...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Rename Modal -->
    <div class="modal-overlay" id="renameModal">
        <div class="modal">
            <div class="modal-title">Set Device Name</div>
            <input type="text" class="modal-input" id="deviceNameInput" placeholder="e.g. My Laptop, Phone-Kodar" maxlength="20">
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeRenameModal()">Cancel</button>
                <button onclick="saveDeviceName()">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal for Images -->
    <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
        <img class="lightbox-img" id="lightboxImg" src="" alt="Full view">
    </div>

    <!-- Video Modal for File Browser Previews -->
    

    <div class="toast-container" id="toastContainer"></div>

    <script>window.ANOTE_IPS = {{IPS_JSON}};</script>
    <script src="/static/js/app.js"></script>
</body>
</html>
